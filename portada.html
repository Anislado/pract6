<!doctype html>

  <title>Portada - Práctica 6</title>
  <style>

      height: 100%;

      font-family: "Times New Roman", Times, serif;
      background-color: white;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;

      text-align: center;
      margin-top: 50px;
    }

    .practice-title {

    }

      margin-top: 60px;
    }

    .students-title {

      font-weight: bold;
    }

    .students-list {
      font-size: 14px;
      line-height: 1.8;
      margin-top: 10px;
    }

    .group-semester {
      text-align: center;
      font-size: 14px;
      margin-top: 25px;
      line-height: 1.8;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
      }

</head>

    </div>

      <div class="students-list">
        320065336<br>
        320084562<br>

        423070635
